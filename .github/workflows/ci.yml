name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -count=1 -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: race + chaos (repeated to catch flakes)
        run: go test -race -count=5 ./...
      - name: benchmark smoke
        run: go test -run '^$' -bench . -benchtime 200x ./proxy
  image:
    runs-on: ubuntu-latest
    needs: [test, race]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rpc-failover-proxy:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TARGET=fake-upstream
          tags: fake-upstream:ci
